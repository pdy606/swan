name: MBRA-PG-Official
goal_type: point_goal
image_resolution: [96, 96]
context_size: 6
input_fps: 5.0
obs_normalize: true
inputs:
  obs_images: {shape: [batch, 6, 3, 96, 96], dtype: float32, description: "6 RGB frames x 3 channels, ImageNet normalized"}
  goal_pose: {shape: [batch, 4], dtype: float32, description: "Goal pose [x/0.8, y/0.8, cos(yaw), sin(yaw)]; x, y in meters divided by metric spacing 0.8"}
outputs:
  waypoints: {shape: [batch, 8, 4], description: "8 waypoints x 4 (x, y, cos(yaw), sin(yaw)); x, y in metric-spacing units (multiply by 0.8 for meters)"}
num_waypoints: 8
