mbra_driver:
  ros__parameters:
    use_sim_time: true
    camera_topic: /camera_driver
    odom_topic: /odom
    provider: cpu
    threads: 2
    context_interval_sec: 0.2
    context_tolerance_sec: 0.075
    sensor_timeout_sec: 0.5
    result_timeout_sec: 1.0
    command_path_timeout_sec: 0.65
    wall_sensor_timeout_sec: 2.0
    lookahead_m: 3.0
    tracking_lookahead_m: 0.65
    waypoint_radius_m: 0.8
    goal_radius_m: 0.5
    world_to_odom_translation: [0.0, 0.0]
    world_to_odom_yaw: 0.0
    route_world_xy: [-35.0, 0.0, 20.5, 0.0, 30.0, 2.2, 37.5, 0.0, 45.0, -2.2, 53.0, 0.0]
    max_speed_mps: 0.30
    max_steer_deg: 35.0
    max_yaw_rate: 0.45
    acceleration_mps2: 0.15
    deceleration_mps2: 0.35
    max_recovery_attempts: 0  # Unlimited sessions; each retains its 0.50m / 15s limits.
    max_run_sim_sec: 600.0
